<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Slack — Encrypted Peer-to-Peer Decentralized Workspace</title>
    <meta
      name="description"
      content="Open-source, decentralized, zero-server Slack alternative featuring end-to-end WebCrypto encryption, peer-to-peer WebRTC mesh, audio/video huddles, threads, and token-gated workspace synchronization."
    />
    <meta
      name="keywords"
      content="Open Slack, Slack clone, peer to peer chat, decentralized workspace, WebRTC huddle, end-to-end encryption, zero server messaging, serverless team chat, WebCrypto, Nostr signaling"
    />
    <meta name="author" content="Open-Slack Community" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1A1D21" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Slack" />
    <meta property="og:title" content="Open Slack — Encrypted Peer-to-Peer Decentralized Workspace" />
    <meta
      property="og:description"
      content="100% serverless, private, peer-to-peer workspace messaging with WebRTC mesh, Nostr signaling, and client-side WebCrypto encryption."
    />
    <meta property="og:image" content="https://animesh.kundus.in/Open-Slack/og-preview.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Slack — Encrypted Peer-to-Peer Decentralized Workspace" />
    <meta
      name="twitter:description"
      content="Open-source decentralized Slack alternative with client-side WebCrypto encryption and zero-server message persistence."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234A154B'/><text x='50' y='67' font-family='sans-serif' font-size='56' font-weight='bold' fill='%23ECB22E' text-anchor='middle'>#</text></svg>"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Open Slack",
        "applicationCategory": "CommunicationApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires WebRTC and WebCrypto support",
        "description": "Decentralized, privacy-first peer-to-peer workspace messaging tool with WebRTC audio/video huddles, threads, and end-to-end encryption.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "End-to-end WebCrypto 256-bit AES-GCM encryption",
          "Peer-to-peer WebRTC mesh with Nostr signaling",
          "Zero-server message persistence",
          "Audio and video huddles with stage and floating dock views",
          "Slack-parity rich message composer, threads, and bookmarks",
          "6 built-in Slack theme presets and custom palette generator"
        ]
      }
    </script>

    <script type="text/javascript">
      // GitHub Pages SPA restore redirect
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="overflow-hidden bg-[#1A1D21]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
