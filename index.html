<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuietSlack - P2P Serverless Workspace</title>
    <meta name="description" content="100% serverless, private, peer-to-peer workspace messaging with WebRTC mesh, Nostr signaling, and Yjs CRDTs." />
    <meta property="og:title" content="QuietSlack" />
    <meta property="og:description" content="100% serverless, private, peer-to-peer workspace messaging with WebRTC mesh, Nostr signaling, and Yjs CRDTs." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%233F0E40'/><text x='50' y='65' font-family='sans-serif' font-size='50' font-weight='bold' fill='%232BAC76' text-anchor='middle'>#</text></svg>" />
    <script type="text/javascript">
      // GitHub Pages SPA restore redirect
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="overflow-hidden bg-[#1A1D21]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
