name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Production build (minified for GitHub Pages)
        env:
          GITHUB_PAGES: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          grep -q '/Open-Slack/' dist/index.html
          js_file="$(find dist/assets -name '*.js' | head -n 1)"
          test -n "$js_file"
          lines="$(wc -l < "$js_file")"
          if [ "$lines" -gt 50 ]; then
            echo "Expected minified JS bundle, but $js_file has $lines lines"
            exit 1
          fi
          echo "Deploy artifact ready: $js_file ($lines lines)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-smoke:
    name: Post-deploy smoke check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages CDN propagation
        run: sleep 15

      - name: Verify deployed site responds
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          # Fallback if output is empty (should not happen on success)
          URL="${PAGE_URL:-https://animeshkundu.github.io/Open-Slack/}"
          # Normalize trailing slash
          URL="${URL%/}/"
          echo "Checking $URL"

          for i in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/pages-body.html -w '%{http_code}' -L --max-time 30 "$URL" || true)"
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 10
          done

          test "$code" = "200"
          grep -qi 'QuietSlack\|root\|Open-Slack' /tmp/pages-body.html
          # Asset references should use the project base path
          grep -E 'src=|href=' /tmp/pages-body.html | head -n 20

          # Follow a hashed asset if present and ensure it is reachable
          asset="$(grep -oE '/Open-Slack/assets/[^" ]+\.js' /tmp/pages-body.html | head -n 1 || true)"
          if [ -n "$asset" ]; then
            asset_url="https://animeshkundu.github.io${asset}"
            echo "Checking asset $asset_url"
            asset_code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$asset_url")"
            test "$asset_code" = "200"
          fi

          echo "Post-deploy smoke check passed for $URL"
