name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Production build (minified for GitHub Pages)
        env:
          GITHUB_PAGES: 'true'
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build

      - name: Verify production artifact
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets
          grep -q "/${REPO_NAME}/" dist/index.html

          largest_js="$(find dist/assets -name '*.js' -printf '%s %p\n' | sort -nr | head -n 1 | awk '{print $2}')"
          test -n "$largest_js"
          lines="$(wc -l < "$largest_js")"
          if [ "$lines" -gt 50 ]; then
            echo "Expected minified JS bundle, but $largest_js has $lines lines"
            exit 1
          fi
          echo "Deploy artifact ready: $largest_js ($lines lines)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  post-deploy-smoke:
    name: Post-deploy smoke check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages CDN propagation
        run: sleep 15

      - name: Verify deployed site responds
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          FALLBACK="https://${OWNER}.github.io/${REPO_NAME}/"
          URL="${PAGE_URL:-$FALLBACK}"
          URL="${URL%/}/"
          echo "Checking $URL"

          code=""
          for i in 1 2 3 4 5 6; do
            code="$(curl -sS -o /tmp/pages-body.html -w '%{http_code}' -L --max-time 30 "$URL" || true)"
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 10
          done

          test "$code" = "200"
          grep -qi 'QuietSlack\|root\|'"$REPO_NAME" /tmp/pages-body.html
          grep -E 'src=|href=' /tmp/pages-body.html | head -n 20

          asset="$(grep -oE "/${REPO_NAME}/assets/[^\" ]+\\.js" /tmp/pages-body.html | head -n 1 || true)"
          if [ -n "$asset" ]; then
            # Prefer the deployed host from PAGE_URL when available
            host="$(echo "$URL" | sed -E 's#(https?://[^/]+).*#\1#')"
            asset_url="${host}${asset}"
            echo "Checking asset $asset_url"
            asset_code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$asset_url")"
            test "$asset_code" = "200"
          fi

          echo "Post-deploy smoke check passed for $URL"
